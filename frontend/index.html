<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWL Mapping Validator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Upload Section -->
            <div class="upload-section">
                <div class="upload-group">
                    <label for="file-input" class="upload-label">Mapping Document</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" class="file-input">
                        <span class="file-name" id="file-name">Choose file</span>
                    </div>
                </div>

                <div class="upload-group">
                    <label for="dwl-file-input" class="upload-label">DWL Script (Optional)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="dwl-file-input" accept=".dwl,.txt" class="file-input">
                        <span class="file-name" id="dwl-file-name">Choose file</span>
                    </div>
                </div>
            </div>

            <!-- Configuration Section -->
            <div id="config-section" class="config-section" style="display: none;">
                <div class="config-group">
                    <label for="source-column">Source Column:</label>
                    <select id="source-column"></select>
                </div>
                
                <div class="config-group">
                    <label for="target-column">Target Column:</label>
                    <select id="target-column"></select>
                </div>
                
                <div class="config-group">
                    <label for="start-row">Start from Row:</label>
                    <input type="number" id="start-row" value="2" min="1">
                </div>

                <button id="validate-btn" class="btn btn-primary">Validate</button>
            </div>

            <!-- Results Section -->
            <div id="results-section" class="results-section" style="display: none;">
                <div class="results-header">
                    <h2>Validation Report</h2>
                    <button id="new-validation-btn" class="btn btn-secondary">New Validation</button>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <div class="tab-buttons">
                        <button class="tab-button active" data-tab="mapped">Mapped Fields</button>
                        <button class="tab-button" data-tab="unmapped">Unmapped Fields</button>
                        <button class="tab-button" data-tab="dwl" id="dwl-tab" style="display: none;">DWL Analysis</button>
                    </div>

                    <!-- Mapped Fields Tab -->
                    <div class="tab-content active" id="mapped-tab">
                        <div id="mapped-list" class="field-list"></div>
                    </div>

                    <!-- Unmapped Fields Tab -->
                    <div class="tab-content" id="unmapped-tab">
                        <div id="unmapped-list" class="field-list"></div>
                    </div>

                    <!-- DWL Analysis Tab -->
                    <div class="tab-content" id="dwl-tab-content">
                        <div class="dwl-analysis">
                            <div class="analysis-section">
                                <h3>Source Fields</h3>
                                <div class="analysis-subsection">
                                    <h4>Found in DWL</h4>
                                    <div id="source-found-list" class="field-list"></div>
                                </div>
                                <div class="analysis-subsection">
                                    <h4>Not Found in DWL</h4>
                                    <div id="source-not-found-list" class="field-list error-list"></div>
                                </div>
                            </div>

                            <div class="analysis-section">
                                <h3>Target Fields</h3>
                                <div class="analysis-subsection">
                                    <h4>Found in DWL</h4>
                                    <div id="target-found-list" class="field-list"></div>
                                </div>
                                <div class="analysis-subsection">
                                    <h4>Not Found in DWL</h4>
                                    <div id="target-not-found-list" class="field-list error-list"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p id="loading-text">Processing...</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
